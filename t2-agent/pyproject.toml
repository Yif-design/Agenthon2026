[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t2agent"
version = "0.1.0"
description = "Agenthon 2026 Track 2 forecasting agent (team submission)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
forecast = "t2agent.cli:main"

[tool.setuptools.packages.find]
include = ["t2agent*"]

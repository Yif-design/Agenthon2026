name: Build T4 submission image

on:
  workflow_dispatch:
    inputs:
      run_nli:
        description: Run the pinned two-member Track 4 NLI audit instead of building an image
        required: false
        type: boolean
        default: false
  push:
    branches:
      - codex/t4-agent-skeleton
    paths:
      - "t4-agent/**"
      - ".github/workflows/t4-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  test-and-push:
    if: ${{ inputs.run_nli != true }}
    # Keep submission builds stable through the 2026-10-19 ubuntu-latest migration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run unit tests
        working-directory: t4-agent
        run: |
          python -m pip install pytest .
          python -m pytest -q

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./t4-agent
          file: ./t4-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yif-design/agenthon2026-t4:dev
          provenance: false
          sbom: false

      - name: Record immutable digest
        run: echo "ghcr.io/yif-design/agenthon2026-t4@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the container command contract
        run: |
          docker pull ghcr.io/yif-design/agenthon2026-t4:dev
          docker run --rm ghcr.io/yif-design/agenthon2026-t4:dev analyze --help

  dated-table-nli-member:
    if: ${{ inputs.run_nli == true }}
    runs-on: ubuntu-24.04
    env:
      T4_ENABLE_DATED_TABLE_BASELINE: "1"
      T4_ENABLE_ADAPTIVE_BATCH: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: cross
            model: cross-encoder/nli-deberta-v3-large
            revision: bab4bc7178836f731dcfd18c06ca9def0a137712
          - slug: moritz
            model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
            revision: b3546ea6b0346eb6f8d5d68b13c7dc6d0376b3d7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Agenthon-2026/track4-analysis-public
          ref: 7b2bce1d80d96f5d5667d7f67bfaa945fa5d1491
          path: official-track4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: t4-nli-${{ matrix.slug }}-${{ matrix.revision }}

      - name: Install pinned judge runtime
        run: |
          python -m pip install "numpy<2"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers
          python -m pip install "qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.4.4#subdirectory=common"
          python -m pip install --no-deps ./official-track4

      - name: Build synthetic units and production answers
        run: |
          python t4-agent/evaluation/experiments/build_dated_table_nli_fixture.py \
            --track4-repo official-track4 \
            --answers-root nli-input/answers \
            --case-manifest nli-input/cases.json
          python t4-agent/evaluation/experiments/build_adaptive_batch_nli_fixture.py \
            --track4-repo official-track4 \
            --answers-root nli-input/answers \
            --case-manifest nli-input/cases.json
          python t4-agent/evaluation/experiments/build_adaptive_batch_nli_fixture.py \
            --track4-repo official-track4 \
            --answers-root nli-input/answers \
            --case-manifest nli-input/cases.json

      - name: Run pinned NLI member
        run: |
          python t4-agent/evaluation/experiments/run_nli_member.py \
            --track4-repo official-track4 \
            --case-manifest nli-input/cases.json \
            --model-id "${{ matrix.model }}" \
            --revision "${{ matrix.revision }}" \
            --cache-dir "$HOME/.cache/huggingface/hub" \
            --out "nli-${{ matrix.slug }}.json"

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: dated-table-nli-${{ matrix.slug }}
          path: nli-${{ matrix.slug }}.json

  dated-table-nli-combine:
    if: ${{ inputs.run_nli == true }}
    needs: dated-table-nli-member
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: dated-table-nli-*
          merge-multiple: true
          path: nli-reports

      - name: Combine official ensemble members
        run: |
          python t4-agent/evaluation/experiments/combine_nli_members.py \
            nli-reports/nli-cross.json nli-reports/nli-moritz.json \
            --out nli-reports/nli-ensemble.json

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: dated-table-nli-ensemble
          path: nli-reports/nli-ensemble.json

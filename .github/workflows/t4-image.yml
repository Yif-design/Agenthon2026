name: Build T4 submission image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/t4-agent-skeleton
    paths:
      - "t4-agent/**"
      - ".github/workflows/t4-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  test-and-push:
    # Keep submission builds stable through the 2026-10-19 ubuntu-latest migration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run unit tests
        working-directory: t4-agent
        run: |
          python -m pip install pytest .
          python -m pytest -q

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./t4-agent
          file: ./t4-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yif-design/agenthon2026-t4:dev
          provenance: false
          sbom: false

      - name: Record immutable digest
        run: echo "ghcr.io/yif-design/agenthon2026-t4@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the container command contract
        run: |
          docker pull ghcr.io/yif-design/agenthon2026-t4:dev
          docker run --rm ghcr.io/yif-design/agenthon2026-t4:dev analyze --help

name: Build T4 submission image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/t4-agent-skeleton
    paths:
      - "t4-agent/**"
      - ".github/workflows/t4-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  test-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        working-directory: t4-agent
        run: |
          python -m pip install pytest .
          python -m pytest -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./t4-agent
          file: ./t4-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yif-design/agenthon2026-t4:dev
          provenance: false
          sbom: false

      - name: Record immutable digest
        run: echo "ghcr.io/yif-design/agenthon2026-t4@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the container command contract
        run: |
          docker pull ghcr.io/yif-design/agenthon2026-t4:dev
          docker run --rm ghcr.io/yif-design/agenthon2026-t4:dev analyze --help
